<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — NG15 Websites CRM</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page">

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="/" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </a>
        <div class="brand-icon">W</div>
        <span class="brand-name">Maintenance Dashboard</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="logout-btn">Sign out</button>
      </div>
    </div>
  </header>

  <div class="maint-toolbar">
    <label for="period-picker">Month</label>
    <input type="month" id="period-picker">
  </div>

  <main class="maint-main">
    <div id="alert" class="alert" hidden></div>
    <div id="tier-groups"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/maintenance-dashboard.js"></script>
</body>
</html>
